<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Toikake 設定</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    h1 { font-size: 1.5em; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    h2 { font-size: 1.2em; margin-top: 20px; }
    .child-entry { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #fafafa; }
    .child-entry input { margin-right: 5px; padding: 5px; }
    button { padding: 5px 10px; cursor: pointer; }
    #save-btn { margin-top: 20px; padding: 10px 20px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 4px; }
    #save-btn:hover { background: #0056b3; }
    .save-message { color: green; display: none; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Toikake 設定</h1>

  <h2>子どもの設定</h2>
  <div id="children-container"></div>
  <br>
  <button id="add-child-btn">+ 子どもを追加</button>

  <h2>教科特化モード (デフォルト)</h2>
  <select id="subject-mode" style="padding: 5px; font-size: 1em;">
    <option value="none">指定なし</option>
    <option value="japanese">国語</option>
    <option value="math">算数</option>
    <option value="science">理科</option>
    <option value="social">社会</option>
    <option value="moral">道徳</option>
  </select>

  <br>
  <h2>API設定</h2>
  <div style="margin-bottom: 20px;">
    <label for="api-key">Gemini API Key:</label><br>
    <input type="password" id="api-key" placeholder="AIzaSy..." style="width: 100%; box-sizing: border-box; padding: 5px; margin-top: 5px;">
  </div>

  <button id="save-btn">保存</button>
  <div id="save-message" class="save-message">保存しました</div>

  <script src="options.js"></script>
</body>
</html>
